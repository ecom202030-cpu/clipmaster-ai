
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipMaster AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}
header{padding:22px;background:#151d32;font-size:23px;font-weight:bold}
header span{color:#8b7cff}
main{max-width:850px;margin:35px auto;padding:18px}
h1{font-size:38px}
p{color:#aab5ca;line-height:1.6}
.panel{background:#172139;padding:22px;border-radius:16px;margin:20px 0}
input,textarea,select{width:100%;padding:13px;margin:10px 0;background:#0b1020;color:white;border:1px solid #39445e;border-radius:9px}
button{padding:13px 18px;border:0;border-radius:9px;background:#806cff;color:white;font-weight:bold;margin:7px 3px;cursor:pointer}
video{width:100%;max-height:450px;background:#050505;border-radius:10px}
.preview{position:relative}
.caption{position:absolute;bottom:45px;left:5%;width:90%;text-align:center;font-size:24px;font-weight:bold;text-shadow:2px 2px 4px black}
</style>
</head>
<body>
<header>▶ ClipMaster <span>AI</span></header>
<main>
<p>CREATE • EDIT • SHARE</p>
<h1>Your Videos, Your Story.</h1>
<p>Your personal video editing studio.</p>

<div class="panel">
<h2>1. Upload Video</h2>
<input type="file" id="file" accept="video/*">
<div class="preview">
<video id="video" controls hidden></video>
<div class="caption" id="overlay"></div>
</div>
</div>

<div class="panel">
<h2>2. Add Captions</h2>
<textarea id="caption" rows="4" placeholder="Write your caption here..."></textarea>
<button onclick="previewCaption()">Preview Caption</button>
<button onclick="downloadSRT()">Download Subtitles</button>
</div>

<div class="panel">
<h2>3. Video Format</h2>
<select id="format">
<option value="16/9">YouTube 16:9</option>
<option value="9/16">Shorts / Reels 9:16</option>
<option value="1/1">Square 1:1</option>
</select>
<p>More AI editing features coming soon.</p>
</div>
</main>

<script>
const file=document.getElementById('file');
const video=document.getElementById('video');

file.onchange=()=>{
 if(file.files[0]){
 video.src=URL.createObjectURL(file.files[0]);
 video.hidden=false;
 }
};

function previewCaption(){
 document.getElementById('overlay').textContent=
 document.getElementById('caption').value;
}

document.getElementById('format').onchange=e=>{
 video.style.aspectRatio=e.target.value;
 video.style.objectFit='contain';
};

function downloadSRT(){
 const text=document.getElementById('caption').value.trim();
 if(!text){alert('Write a caption first');return;}
 const srt='1\n00:00:00,000 --> 00:00:05,000\n'+text+'\n';
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([srt],{type:'text/plain'}));
 a.download='captions.srt';
 a.click();
 URL.revokeObjectURL(a.href);
}
</script>
</body>
  </html>
